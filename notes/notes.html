<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e9"><meta name="description" content="One hundred little notes, waiting for you."><title>Notes · Our little corner</title><link rel="stylesheet" href="notes.css"><link rel="preload" href="../images/open.png" as="image"><link rel="stylesheet" href="../assets/mobile.css"></head>
<body><header class="notes-header"><a class="back-home" href="../home.html"><span aria-hidden="true">←</span> Back to Home</a></header><main class="container"><span class="eyebrow">A little something, just for you</span><h1 class="title">Notes</h1><p class="subtitle">Tap an envelope to open your note</p><div class="progress-container" id="readingProgress" role="progressbar" aria-label="Notes read" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressFill" class="progress-fill"></div></div><p id="progressPercent" class="progress-text" aria-live="polite" aria-atomic="true">0% read · 0 of 100 notes</p><div class="reset-controls"><button id="resetRead" class="reset-btn" type="button">Minh Anh no Press pls</button><button id="undoReset" class="undo-btn" type="button" disabled>Undo Reset</button></div><p id="storageMessage" class="storage-message" role="status" hidden></p><ul class="envelope-grid" id="envelopeGrid" aria-label="100 notes"></ul></main>
<dialog id="noteModal" class="modal" aria-labelledby="modalTitle"><div class="modal-content"><button id="closeNote" class="close" type="button" aria-label="Close note">×</button><p class="modal-eyebrow">A little note for you</p><h2 id="modalTitle">Note 1</h2><p id="modalText"></p></div></dialog><script src="notes-data.js"></script><script src="notes.js"></script></body></html>
